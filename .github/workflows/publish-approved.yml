name: Publish approved KMX RADAR package

on:
  push:
    paths:
      - "approved/**/.ready"
      - "approved/**/publication.json"
      - "approved/**/visual-qc.json"
      - "approved/**/visual-sources.json"
      - "data/chatgpt_state.json"
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kmx-radar-main-writer
  cancel-in-progress: false

env:
  INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
  TOKEN_ENCRYPTION_PASSWORD: ${{ secrets.TOKEN_ENCRYPTION_PASSWORD }}

jobs:
  publish:
    if: github.repository_owner == 'TheKillerMax'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -e .

      - name: Configure Git
        run: |
          git config user.name "KMX RADAR Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Reconcile missing publish markers and receipts
        run: python -m kmxradar reconcile-pipeline

      - name: Persist reconciliation before external publishing
        shell: bash
        run: |
          set -euo pipefail
          git add approved data
          if ! git diff --cached --quiet; then
            git commit -m "radar: reconcile publish pipeline"
            bash .github/scripts/push-main-safely.sh
          fi

      - name: Render any legacy approved media
        run: python -m kmxradar prepare-approved

      - name: Persist media before external publishing
        shell: bash
        run: |
          set -euo pipefail
          git add approved
          if ! git diff --cached --quiet; then
            git commit -m "radar: render approved publication media"
            bash .github/scripts/push-main-safely.sh
          fi

      - name: Identify current ready package and authentication backoff
        id: publish_candidate
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          state_path = Path("data/chatgpt_state.json")
          state = json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {}
          publication_id = str(state.get("last_publication_id") or "")
          if publication_id:
              ready = (Path("approved") / publication_id / ".ready").exists()
          else:
              ready = any(Path("approved").glob("*/.ready"))
          auth_hold = state.get("external_error_code") == "instagram_auth_190"
          retry = str(state.get("next_publish_retry_at") or "")
          try:
              retry_at = datetime.fromisoformat(retry.replace("Z", "+00:00"))
          except ValueError:
              retry_at = None
          backoff = bool(auth_hold and retry_at and datetime.now(timezone.utc) < retry_at)
          manual = os.getenv("GITHUB_EVENT_NAME") == "workflow_dispatch"
          should_publish = ready and (not backoff or manual)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"should_publish={'true' if should_publish else 'false'}\n")
          if ready and backoff and not manual:
              print("Instagram account verification is blocked; skipping repeated Graph API call.")
          elif not ready:
              print("No current ready package; skipping unnecessary 15-second media wait.")
          PY

      - name: Wait for raw GitHub media propagation
        if: steps.publish_candidate.outputs.should_publish == 'true'
        run: sleep 15

      - name: Publish first ready package
        if: steps.publish_candidate.outputs.should_publish == 'true'
        id: publish
        continue-on-error: true
        run: python -m kmxradar publish-approved

      - name: Summarize publication and external blocks
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          state_file = Path("data/chatgpt_state.json")
          state = json.loads(state_file.read_text(encoding="utf-8")) if state_file.exists() else {}
          phase = str(state.get("phase") or "unknown")
          publication_id = str(state.get("last_publication_id") or "none")
          note = str(state.get("note") or "").replace("\n", " ")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("### KMX RADAR publication status\n")
              out.write(f"- Publication: `{publication_id}`\n")
              out.write(f"- State: `{phase}`\n")
              if state.get("external_error_code") == "instagram_auth_190":
                  out.write("- **BLOCKED BY INSTAGRAM ACCOUNT VERIFICATION**; no post was sent.\n")
                  out.write(f"- Next automatic check: {state.get('next_publish_retry_at') or 'unspecified'}\n")
              if note:
                  out.write(f"- Detail: {note}\n")
          PY

      - name: Persist receipt, history and pipeline state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add -A approved data
          if ! git diff --cached --quiet; then
            git commit -m "radar: persist Instagram publication result"
            bash .github/scripts/push-main-safely.sh
          fi

      - name: Fail job after persisting publication error
        if: steps.publish.outcome == 'failure'
        run: exit 1
