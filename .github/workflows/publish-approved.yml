name: Publish approved KMX RADAR package

on:
  push:
    paths:
      - "approved/**/.ready"
      - "approved/**/publication.json"
      - "approved/**/visual-qc.json"
      - "approved/**/visual-sources.json"
      - "data/chatgpt_state.json"
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kmx-radar-main-writer
  cancel-in-progress: false

env:
  INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
  TOKEN_ENCRYPTION_PASSWORD: ${{ secrets.TOKEN_ENCRYPTION_PASSWORD }}

jobs:
  publish:
    if: github.repository_owner == 'TheKillerMax'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -e .

      - name: Reconcile missing publish markers and receipts
        run: python -m kmxradar reconcile-pipeline

      - name: Persist publish reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KMX RADAR Bot"
          git config user.email "actions@users.noreply.github.com"
          git add approved data
          if ! git diff --cached --quiet; then
            git commit -m "radar: reconcile publish pipeline"
            git pull --rebase origin main
            git push
          fi

      - name: Render any legacy approved media
        run: python -m kmxradar prepare-approved

      - name: Persist rendered media
        shell: bash
        run: |
          set -euo pipefail
          git add approved
          if ! git diff --cached --quiet; then
            git commit -m "radar: render approved publication media"
            git pull --rebase origin main
            git push
          fi

      - name: Wait for raw GitHub media propagation
        run: sleep 15

      - name: Publish first ready package
        id: publish
        continue-on-error: true
        run: python -m kmxradar publish-approved

      - name: Persist durable receipt and publication history
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KMX RADAR Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A approved data/published.json data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "radar: persist durable Instagram receipt"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                break
              fi
              git rebase --abort 2>/dev/null || true
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi

      - name: Persist final ChatGPT state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add data/chatgpt_state.json
          if ! git diff --cached --quiet; then
            git commit -m "radar: persist final pipeline state"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                break
              fi
              git rebase --abort 2>/dev/null || true
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi

      - name: Fail job after persisting publication error
        if: steps.publish.outcome == 'failure'
        run: exit 1
