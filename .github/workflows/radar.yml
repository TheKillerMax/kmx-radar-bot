name: Build KMX RADAR intake ZIP

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmx-radar-collector
  cancel-in-progress: true

jobs:
  collect:
    if: github.repository_owner == 'TheKillerMax'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -e .

      - name: Build evidence ZIP
        run: python -m kmxradar collect

      - name: Upload ZIP for ChatGPT
        uses: actions/upload-artifact@v4
        with:
          name: kmx-radar-intake-${{ github.run_id }}
          path: outbox/*.zip
          if-no-files-found: error
          retention-days: 3
