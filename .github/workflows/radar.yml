name: Build KMX RADAR intake ZIP

on:
  schedule:
    # 00:05, 06:05, 12:05 y 18:05 en horario UTC-3
    - cron: "5 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kmx-radar-main-writer
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository_owner == 'TheKillerMax'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -e .

      - name: Build evidence ZIP
        run: python -m kmxradar collect

      - name: Refresh latest intake snapshot
        shell: bash
        run: |
          set -euo pipefail
          zipfile="$(ls -t outbox/*.zip | head -1)"
          rm -rf intake/latest
          mkdir -p intake/latest
          unzip -q "$zipfile" -d intake/latest

      - name: Commit latest intake snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KMX RADAR Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A intake/latest
          if ! git diff --cached --quiet; then
            git commit -m "radar: refresh latest intake snapshot"
            git push origin HEAD:main
          fi

      - name: Upload ZIP for manual inspection
        uses: actions/upload-artifact@v4
        with:
          name: kmx-radar-intake-${{ github.run_id }}
          path: outbox/*.zip
          if-no-files-found: error
          retention-days: 3
