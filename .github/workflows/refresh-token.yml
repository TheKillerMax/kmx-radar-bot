name: Refresh Instagram token

on:
  schedule:
    - cron: "31 7 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kmx-radar-token
  cancel-in-progress: false

env:
  INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
  TOKEN_ENCRYPTION_PASSWORD: ${{ secrets.TOKEN_ENCRYPTION_PASSWORD }}

jobs:
  refresh:
    if: github.repository_owner == 'TheKillerMax'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -e .
      - name: Refresh and encrypt token
        run: python -m kmxradar refresh-token
      - name: Persist encrypted refreshed token
        run: |
          git config user.name "KMX RADAR Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/instagram_token.enc data/instagram_token_meta.json
          if ! git diff --cached --quiet; then
            git commit -m "security: refresh encrypted Instagram token"
            git push
          fi
