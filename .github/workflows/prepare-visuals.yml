name: Prepare KMX RADAR visuals

on:
  push:
    paths:
      - "approved/**/.visualize"
      - "approved/**/visuals.json"
      - "approved/**/visual-sources.json"
      - "approved/**/handoff.json"
      - "data/chatgpt_state.json"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kmx-radar-main-writer
  cancel-in-progress: false

jobs:
  visuals:
    if: github.repository_owner == 'TheKillerMax'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -e .

      - name: Configure Git
        run: |
          git config user.name "KMX RADAR Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Reconcile missing visual markers
        run: python -m kmxradar reconcile-pipeline

      - name: Persist reconciliation before rendering
        shell: bash
        run: |
          set -euo pipefail
          git add approved data
          if ! git diff --cached --quiet; then
            git commit -m "radar: reconcile visual pipeline"
            git push origin HEAD:main
          fi

      - name: Render and validate real licensed visuals
        id: render
        continue-on-error: true
        run: python -m kmxradar prepare-visuals

      - name: Record visual failure for recovery
        if: steps.render.outcome == 'failure'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state_path = Path("data/chatgpt_state.json")
          state = json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {}
          state["phase"] = "visual_incomplete"
          state["last_result"] = "visual_incomplete"
          state["note"] = "GitHub visual renderer failed. The persisted .visualize marker lets the scheduled recovery retry after correction."
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Persist visual result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add approved data
          if ! git diff --cached --quiet; then
            git commit -m "radar: persist visual pipeline result"
            git push origin HEAD:main
          fi

      - name: Fail job after persisting visual error
        if: steps.render.outcome == 'failure'
        run: exit 1
