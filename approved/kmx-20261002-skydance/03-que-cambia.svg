<text x="90" y="785" font-family="DejaVu Sans,Arial" font-size="31" font-weight="700" fill="#13f2c2">¿Qué significa “cerrar” una fusión?</text>
<text x="90" y="845" font-family="DejaVu Sans,Arial" font-size="27" font-weight="400" fill="#d6e0e7">Es el momento en que la operación se completa legalmente</text><text x="90" y="888" font-family="DejaVu Sans,Arial" font-size="27" font-weight="400" fill="#d6e0e7">y empieza a funcionar la nueva estructura corporativa.</text><text x="90" y="931" font-family="DejaVu Sans,Arial" font-size="27" font-weight="400" fill="#d6e0e7">Antes de eso, la operación puede estar aprobada y muy avanzada,</text><text x="90" y="974" font-family="DejaVu Sans,Arial" font-size="27" font-weight="400" fill="#d6e0e7">pero sigue sujeta a las últimas condiciones de cierre.</text>
