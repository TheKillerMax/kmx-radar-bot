<text x="75" y="236" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" fill="#13f2c2">3 DUDAS QUE CONFUNDEN</text>
<text x="985" y="1285" text-anchor="end" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" fill="#8fa6b7">9/10</text>
<text x="55" y="1285" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" fill="#13f2c2">@kmxradar</text>
<text x="55" y="1320" font-family="DejaVu Sans,Arial" font-size="15" fill="#8095a5">02 OCT 2026 · FUENTES EN LA ÚLTIMA DIAPOSITIVA</text>
<text x="55" y="340" font-family="DejaVu Sans,Arial" font-size="48" font-weight="700" fill="#f5f8fb">ANTES DE COMENTAR: ESTO ES CLAVE</text>
