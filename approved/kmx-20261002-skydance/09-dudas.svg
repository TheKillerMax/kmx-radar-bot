 <circle cx="95" cy="458" r="10" fill="#ffd35a"/>
 <text x="125" y="468" font-family="DejaVu Sans,Arial" font-size="29" font-weight="700" fill="#f5f8fb">“¿LA FUSIÓN YA ESTÁ HECHA?”</text>
 <text x="125" y="515" font-family="DejaVu Sans,Arial" font-size="24" font-weight="400" fill="#aebdca">No. Está prevista para el 6 de octubre.</text><text x="125" y="549" font-family="DejaVu Sans,Arial" font-size="24" font-weight="400" fill="#aebdca">Todavía depende de las condiciones finales.</text>
<rect x="55" y="645" width="970" height="230" rx="26" fill="#0b2233" stroke="#123f52" stroke-width="2"/>
 <circle cx="95" cy="693" r="10" fill="#24b8ff"/>
 <text x="125" y="703" font-family="DejaVu Sans,Arial" font-size="29" font-weight="700" fill="#f5f8fb">“¿VALE US$81.000 O US$110.000 MILLONES?”</text>
 <text x="125" y="750" font-family="DejaVu Sans,Arial" font-size="24" font-weight="400" fill="#aebdca">Puedes ver ambas cifras.</text><text x="125" y="784" font-family="DejaVu Sans,Arial" font-size="24" font-weight="400" fill="#aebdca">US$81.000 millones se usa para la operación;</text><text x="125" y="818" font-family="DejaVu Sans,Arial" font-size="24" font-weight="400" fill="#aebdca">al incluir deuda, AP sitúa el total cerca de US$111.000 millones.</text>
<rect x="55" y="905" width="970" height="235" rx="26" fill="#0b2233" stroke="#123f52" stroke-width="2"/>
 <circle cx="95" cy="953" r="10" fill="#13f2c2"/>
 <text x="125" y="963" font-family="DejaVu Sans,Arial" font-size="29" font-weight="700" fill="#f5f8fb">“¿SUBIRÁN LOS PRECIOS O DESAPARECERÁN APPS?”</text>
 <text x="125" y="1010" font-family="DejaVu Sans,Arial" font-size="24" font-weight="400" fill="#aebdca">No hay confirmación oficial de un cambio inmediato.</text><text x="125" y="1044" font-family="DejaVu Sans,Arial" font-size="24" font-weight="400" fill="#aebdca">Eso tendrá que definirse durante la integración.</text>
