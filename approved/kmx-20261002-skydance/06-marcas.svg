<image href="../../assets/logo.svg" x="42" y="30" width="155" height="155"/>
<text x="218" y="82" font-family="DejaVu Sans,Arial" font-size="28" font-weight="700" fill="#f5f8fb">KMX RADAR</text>
<text x="218" y="114" font-family="DejaVu Sans,Arial" font-size="15" font-weight="700" fill="#13f2c2">DETECTAMOS LO QUE IMPORTA</text>
<rect x="55" y="205" width="384" height="46" rx="18" fill="#0b2738"/>
<text x="75" y="236" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" fill="#13f2c2">¿DESAPARECEN LAS MARCAS?</text>
<text x="985" y="1285" text-anchor="end" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" fill="#8fa6b7">6/10</text>
<text x="55" y="1285" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" fill="#13f2c2">@kmxradar</text>
<text x="55" y="1320" font-family="DejaVu Sans,Arial" font-size="15" fill="#8095a5">02 OCT 2026 · FUENTES EN LA ÚLTIMA DIAPOSITIVA</text>
<text x="55" y="340" font-family="DejaVu Sans,Arial" font-size="48" font-weight="700" fill="#f5f8fb">NO ES “TODO SE LLAMARÁ SKYDANCE”</text>
<text x="55" y="395" font-family="DejaVu Sans,Arial" font-size="27" fill="#aebdca">Skydance sería el nombre de la empresa matriz.</text>
<rect x="55" y="465" width="970" height="500" rx="28" fill="#0b2233"/>
<text x="90" y="530" font-family="DejaVu Sans,Arial" font-size="27" font-weight="700" fill="#13f2c2">LAS MARCAS SEGUIRÍAN EXISTIENDO</text>
<text x="110" y="600" font-family="DejaVu Sans,Arial" font-size="33" font-weight="700" fill="#f5f8fb">Paramount Pictures</text><text x="110" y="660" font-family="DejaVu Sans,Arial" font-size="33" font-weight="700" fill="#f5f8fb">Warner Bros. Pictures</text><text x="110" y="720" font-family="DejaVu Sans,Arial" font-size="33" font-weight="700" fill="#f5f8fb">CBS + CNN</text><text x="110" y="780" font-family="DejaVu Sans,Arial" font-size="33" font-weight="700" fill="#f5f8fb">HBO + HBO Max</text><text x="110" y="840" font-family="DejaVu Sans,Arial" font-size="33" font-weight="700" fill="#f5f8fb">Paramount+</text><text x="110" y="900" font-family="DejaVu Sans,Arial" font-size="33" font-weight="700" fill="#f5f8fb">Discovery, Cartoon Network, Nickelodeon y más</text>
<rect x="55" y="1020" width="970" height="150" rx="24" fill="#0b2c39" stroke="#13f2c2" stroke-width="2"/>
<text x="85" y="1072" font-family="DejaVu Sans,Arial" font-size="24" font-weight="700" fill="#13f2c2">EN SIMPLE</text>
<text x="85" y="1120" font-family="DejaVu Sans,Arial" font-size="25" fill="#d6e0e7">Cambia el nombre del grupo que está encima; no significa que</text>
<text x="85" y="1155" font-family="DejaVu Sans,Arial" font-size="25" fill="#d6e0e7">Warner Bros., HBO o Paramount desaparezcan como marcas.</text>
