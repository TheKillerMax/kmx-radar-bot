<text x="218" y="82" font-family="DejaVu Sans,Arial" font-size="28" font-weight="700" fill="#f5f8fb">KMX RADAR</text>
<text x="218" y="114" font-family="DejaVu Sans,Arial" font-size="15" font-weight="700" fill="#13f2c2">DETECTAMOS LO QUE IMPORTA</text>
<rect x="55" y="205" width="352" height="46" rx="18" fill="#0b2738"/>
<text x="75" y="236" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" fill="#13f2c2">SI TIENES ACCIONES WBD</text>
<text x="985" y="1285" text-anchor="end" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" fill="#8fa6b7">5/10</text>
<text x="55" y="1285" font-family="DejaVu Sans,Arial" font-size="22" font-weight="700" fill="#13f2c2">@kmxradar</text>
<text x="55" y="1320" font-family="DejaVu Sans,Arial" font-size="15" fill="#8095a5">02 OCT 2026 · FUENTES EN LA ÚLTIMA DIAPOSITIVA</text>
<text x="55" y="340" font-family="DejaVu Sans,Arial" font-size="47" font-weight="700" fill="#f5f8fb">¿QUÉ PASA CON LOS ACCIONISTAS?</text>
<rect x="55" y="420" width="970" height="245" rx="28" fill="#0b2233" stroke="#13f2c2" stroke-width="2"/>
<text x="90" y="495" font-family="DejaVu Sans,Arial" font-size="27" font-weight="700" fill="#aebdca">POR CADA ACCIÓN DE WBD ELEGIBLE</text>
<text x="90" y="585" font-family="DejaVu Sans,Arial" font-size="70" font-weight="800" fill="#13f2c2">$31,00 EN EFECTIVO</text>
<text x="90" y="630" font-family="DejaVu Sans,Arial" font-size="23" fill="#aebdca">+ un pequeño importe diario desde el 1 de octubre hasta el cierre.</text>
<rect x="55" y="720" width="970" height="275" rx="28" fill="#0b2233"/>
<text x="90" y="790" font-family="DejaVu Sans,Arial" font-size="31" font-weight="700" fill="#ffd35a">¿Por qué hay ese extra diario?</text>
<text x="90" y="850" font-family="DejaVu Sans,Arial" font-size="25" font-weight="400" fill="#d6e0e7">El acuerdo añade $0,00277778 por acción por cada día</text><text x="90" y="890" font-family="DejaVu Sans,Arial" font-size="25" font-weight="400" fill="#d6e0e7">transcurrido después del 30 de septiembre hasta el cierre.</text><text x="90" y="930" font-family="DejaVu Sans,Arial" font-size="25" font-weight="400" fill="#d6e0e7">Es una compensación por el tiempo adicional hasta completar</text><text x="90" y="970" font-family="DejaVu Sans,Arial" font-size="25" font-weight="400" fill="#d6e0e7">la operación.</text>
<text x="55" y="1100" font-family="DejaVu Sans,Arial" font-size="21" fill="#8095a5">Fuente: comunicado conjunto Paramount Skydance / Warner Bros. Discovery.</text>
