brand:
  name: "KMX RADAR"
  handle: "@kmxradar"
  tagline: "Detectamos lo que importa"

runtime:
  gdelt_timespan: "6h"
  gdelt_max_records_per_query: 80
  max_candidates_per_run: 60
  max_intake_events: 10
  fetch_sources_per_cluster: 5
  excerpt_chars_per_source: 1200
  publish_threshold_low_risk: 0.77
  publish_threshold_high_risk: 0.89
  minimum_independent_domains: 3
  high_risk_minimum_domains_without_primary: 5
  max_posts_per_day: 8
  min_minutes_between_posts: 75

instagram:
  api_version: "v26.0"
  graph_host: "https://graph.instagram.com"
  caption_max_chars: 2100
  poll_attempts: 12
  poll_seconds: 5
